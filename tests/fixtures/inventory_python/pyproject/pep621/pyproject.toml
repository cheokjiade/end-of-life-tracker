[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    # direct runtime dependencies
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]==0.30.1 ; python_version >= '3.8'",
    "httpx @ https://files.example.com/httpx-0.27.0.whl",
]

[project.optional-dependencies]
dev = ["pytest==8.2.0", "hypothesis~=6.100"]
docs = ["mkdocs==1.6.0"]

[tool.sample]
flag = true
count = 3
ratio = 0.5
name = 'literal-name'
