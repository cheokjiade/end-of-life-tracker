[tool.poetry]
name = "poetry-app"
version = "2.0.0"

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
requests = "2.31.0"
httpx = "^0.27.0"
pendulum = "*"
toolz = { version = "^1.2", extras = ["serde"] }
local-pkg = { path = "../local/pkg" }
git-pkg = { git = "https://github.com/example/git-pkg.git" }

[tool.poetry.dev-dependencies]
pytest = "8.2.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.0"
